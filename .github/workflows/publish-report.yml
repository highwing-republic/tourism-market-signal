name: Publish updated tourism report

on:
  workflow_run:
    workflows: [Daily tourism market signal]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

concurrency:
  group: publish-tourism-report
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request publication of the latest report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
