name: Daily tourism market signal

on:
  schedule:
    # GitHub cron is UTC. Sun-Thu 22:30 UTC = Mon-Fri 07:30 JST.
    - cron: "30 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-tourism-market-signal
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and test
        run: |
          python scripts/validate_universe.py
          python -m pytest -q
          python -m compileall -q app main.py scripts

      - name: Generate JSON and HTML reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TOP_N: "5"
          LLM_MAX_TARGETS: "5"
        run: python main.py

      - name: Commit generated reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/latest.json data/history
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Update tourism market signal"
          git push

